# Compile PYLOM
#   Compile with g++ or Intel C++ Compiler
#   Compile with the most aggressive optimization setting (O3)
#   Use the most pedantic compiler settings: must compile with no warnings at all
#
# The user may override any desired internal variable by redefining it via command-line:
#   make CXX=g++ [...]
#   make OPTL=-O2 [...]
#   make FLAGS="-Wall -g" [...]
#
# Arnau Miro 2021

## Options
#
PLATFORM         = MN5_GPP
VECTORIZATION    = ON
OPENMP_PARALL    = OFF
USE_MKL          = ON
USE_FFTW         = ON
USE_GCC          = OFF
USE_NVHPC        = OFF
DEBUGGING        = OFF
USE_GESVD        = OFF
USE_COMPILED     = ON
# Comma separated list of the modules to be compiled
# if USE_COMPILED = ON
MODULES_COMPILED = MATH.MATHS,MATH.AVERAGING,MATH.QR,MATH.SVD,MATH.FFT,MATH.GEOMETRIC,MATH.TRUNCATION,MATH.STATS,MATH.REGRESSION,MATH.LINEAR,MATH.DATAPROCESSING,ROM.POD,ROM.DMD,ROM.SPOD,ROM.RES


## Optimization, host and CPU type
#
OPTL = 3
HOST = Host
TUNE = sapphirerapids


## Python versions
#
PYTHON = python3
PIP    = pip3

## Versions of the libraries
#
LAPACK_VERS   = 3.9.0
FFTW_VERS     = 3.3.10
NFFT_VERS     = 3.5.2
KISSFFT_VERS  = 131.1.0
OPENBLAS_VERS = 0.3.17
ONEAPI_VERS   = 2023.2.0
